<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__APPNAME__</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="__APPNAME__">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="__ICON__">
<link rel="icon" href="__ICON__">
<!-- Chrome / Edge "Install app" — sidecar files live next to this page.
     Opened from file:// they 404 harmlessly and the app still works. -->
<!-- [Manifest for non-iOS only] The moment modern iOS sees a manifest it lets it take over
     "Add to Home Screen", apple-mobile-web-app-status-bar-style: black-translucent is ignored,
     and the page gets boxed into a frame shorter than the screen (measured: viewport 844 / screen 912,
     safe area 0/0) — a 68px strip appears out of nowhere at the bottom that no CSS can reach.
     Withhold the manifest on iOS and it falls back to the old apple-meta path — the one that actually gets full screen.
     Icons are unaffected: the apple-touch-icon above is the one iOS really uses.
     Chrome/Edge still get the manifest, so "Install app" works as before. -->
<script>
(function(){
  var ua = navigator.userAgent || '';
  var iOS = /iP(hone|od|ad)/.test(ua) ||
            (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);   // iPadOS masquerades as a Mac
  if(iOS) return;
  var l = document.createElement('link');
  l.rel = 'manifest'; l.href = 'manifest.webmanifest';
  document.head.appendChild(l);
})();
</script>
<style>
:root{
  --bg:#eef0f3; --card:#ffffff; --ink:#15181c; --ink2:#454b52; --mute:#8b9198;
  --line:#e2e5e9; --codebg:#f5f6f8; --codebg0:rgba(245,246,248,0); --codeline:#d7dbe0;
  --keybg:#eef8f2; --keyline:#4b9e6a; --keyink:#1c3f2b;
  --warnbg:#fdf8ec; --warnline:#e0a53a; --warnink:#5b4a1f;
  --chip:#f1f3f5; --shadow:0 10px 34px rgba(16,20,28,.13),0 2px 6px rgba(16,20,28,.07);
  /* Diagram colours. Every SVG writes var(--fig-*), so dark mode follows automatically — no need for two sets of figures */
  --fig-ink:#3f4650; --fig-mute:#8b9198; --fig-ac:#0369a1; --fig-hi:#dbeafe;
  --fig-fill:#f7f8fa; --fig-bad:#c0392b; --fig-good:#15803d;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1014; --card:#1b1f25; --ink:#eef1f4; --ink2:#b9c0c8; --mute:#79828c;
    --line:#2c323a; --codebg:#14181d; --codebg0:rgba(20,24,29,0); --codeline:#39414a;
    --keybg:#152820; --keyline:#3f8a5c; --keyink:#b9e6cb;
    --warnbg:#2a2110; --warnline:#c08c2c; --warnink:#f0d9a6;
    --chip:#262c34; --shadow:0 10px 34px rgba(0,0,0,.5);
    --fig-ink:#c3cad2; --fig-mute:#79828c; --fig-ac:#6ab0e0; --fig-hi:#1d3448;
    --fig-fill:#20252c; --fig-bad:#e8776a; --fig-good:#5fbe84;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none;
}
#app{
  position:fixed; inset:0; display:flex; flex-direction:column;
  /* [Bottom safe area is NOT consumed here] This used to stack on top of the footer's padding-bottom,
     leaving two layers of dead space below. The footer now owns the bottom in one place, and the card gets to grow downward. */
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}

/* ── top bar ── */
header{display:flex;align-items:center;gap:10px;padding:10px 16px 6px;flex:none}
.hbtn{
  width:34px;height:34px;border-radius:11px;border:none;background:var(--chip);color:var(--ink2);
  display:grid;place-items:center;font-size:15px;flex:none;cursor:pointer;transition:transform .12s
}
.hbtn:active{transform:scale(.9)}
.hbtn.on{background:var(--ink);color:var(--card)}
.hmid{flex:1;min-width:0;text-align:center}
.hsec{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcnt{font-size:10.5px;color:var(--mute);margin-top:2px;font-variant-numeric:tabular-nums}
.bar{height:2.5px;background:var(--line);border-radius:2px;margin:4px 16px 0;flex:none;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;transition:width .28s cubic-bezier(.2,.8,.3,1)}

/* ── card ── */
.stage{flex:1;min-height:0;position:relative;padding:10px 14px 6px;perspective:1400px}
.card{
  position:absolute;inset:10px 14px 6px;background:var(--card);border-radius:22px;
  box-shadow:var(--shadow);overflow:hidden;transform-origin:center center;
  display:flex;flex-direction:column;
}
/* A permanent will-change promotes the whole card (long solution face included) to its own compositor
   layer, which then gets re-rasterised in big chunks while scrolling. Attach it only for the few hundred ms of a real animation/drag. */
.card.anim{transition:transform .17s ease-in, opacity .17s ease-in;will-change:transform,opacity}
.card.slide{transition:transform .26s cubic-bezier(.3,.7,.3,1), opacity .26s;will-change:transform,opacity}
/* [Don't call it .grab] .grab is the little handle on the sheet below (38×4px); the moment the card picks up
   that class, that rule squashes it into a 4px sliver — the card vanishes as soon as a finger touches it, which looks exactly like the "blank screen" bug. */
.card.hold{will-change:transform,opacity}
/* The idle card: display:none, so the browser skips layout for it entirely — a card you can't reach costs nothing to render */
.card.gone{display:none}
.accent{height:4px;flex:none}

/* front */
.face{flex:1;min-height:0;display:flex;flex-direction:column;padding:20px 22px 16px;overflow:hidden}
/* touch-action is intersected along the ancestor chain: with pan-y here, the code block's pan-x inside
   intersects with it to nothing, and horizontal code scrolling simply never works on a real device. Allow both
   directions; when there's nothing horizontally scrollable the browser naturally does nothing, and card swipes are left to JS. */
.face.scroll{overflow-y:auto;overscroll-behavior:contain;
  touch-action:pan-x pan-y}
.fsec{font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}
.ftitle{font-size:24px;font-weight:750;line-height:1.18;margin-top:8px;letter-spacing:-.01em}
.frule{height:3px;width:44px;border-radius:3px;margin:13px 0 0}
.hookwrap{flex:1;display:flex;align-items:center;min-height:0}
.hook{font-size:19px;line-height:1.48;color:var(--ink);font-weight:420}
.hook .sub{display:block;margin-top:10px;font-size:15px;color:var(--mute);font-style:italic}
.hook .lead{display:block;font-size:.63em;color:var(--mute);font-weight:550;line-height:1.5;
            margin-bottom:15px;letter-spacing:.005em}
.hook .stmt{display:block}
/* Example: one line of small monospace. Its job is to "make the problem concrete", so it must be clearly
   set apart from the statement without stealing the show — a vertical bar + grey text, no box, no fill. */
.hook .ex{display:block;margin-top:12px;padding-left:11px;border-left:2px solid var(--line);
  font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace;
  font-size:.68em;line-height:1.55;color:var(--mute);white-space:pre-wrap;word-break:break-word}
.hook .prompt{display:block;margin-top:14px;font-size:.7em;color:var(--mute);letter-spacing:.04em;font-weight:600}
/* code inside the statement is monospace only, no fill or border — five or six grey boxes embedded in one paragraph only adds clutter */
.hook .stmt code{background:none;border:none;padding:0;font-size:.93em;color:var(--ink)}
/* The statement starts from a fixed position so the eye lands in the same spot on every card; a concept card's one-line question stays centred */
.hookwrap.top{align-items:flex-start;padding-top:16px}

/* hints + actions (problem cards) */
.tools{flex:none;padding-top:10px}
.hrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hlab{font-size:11px;color:var(--mute);letter-spacing:.08em;font-weight:700}
.hbtn2{height:30px;min-width:34px;padding:0 11px;border-radius:10px;border:1px dashed var(--line);
  background:transparent;color:var(--mute);font-size:13px;font-weight:650;font-family:inherit;cursor:pointer}
.hbtn2:active{transform:scale(.94)}
.hbtn2.used{border-style:solid;border-color:transparent;background:var(--chip);color:var(--ink2)}
.hint{margin-top:9px;padding:9px 12px;border-radius:0 9px 9px 0;font-size:13.5px;line-height:1.5;
  background:var(--chip);border-left:3px solid var(--mute);color:var(--ink2)}
.hint b{color:var(--ink)}
.hint u{text-decoration:none;color:var(--mute);font-weight:700;margin-right:6px}
.arow{display:flex;gap:8px;margin-top:12px}
.abtn{flex:1;height:38px;border-radius:12px;border:1px solid var(--line);background:transparent;
  color:var(--ink2);font-size:13.5px;font-weight:650;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.abtn:active{transform:scale(.96)}
.abtn.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.mbadge{font-size:9.5px;font-weight:800;letter-spacing:.09em;color:#b45309;background:#fef3c7;
  padding:2px 6px;border-radius:5px;margin-left:8px;vertical-align:2px}
@media (prefers-color-scheme: dark){.mbadge{color:#fbbf24;background:#3a2c0a}}
.cue{position:absolute;left:0;right:0;bottom:0;height:40px;pointer-events:none;opacity:0;
     transition:opacity .25s;display:flex;align-items:flex-end;justify-content:center;
     padding-bottom:5px;font-size:15px;color:var(--mute);
     background:linear-gradient(to bottom,rgba(0,0,0,0),var(--card) 78%)}
.card.hasmore .cue{opacity:1}
.hint2{text-align:center;font-size:11.5px;color:var(--mute);letter-spacing:.05em;flex:none;padding-top:10px}

/* back */
.pat{text-transform:uppercase;letter-spacing:.07em;font-size:11.5px}
.btitle{font-size:13px;font-weight:750;color:var(--ink2);display:flex;align-items:center;gap:7px;
        padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:12px;flex:none}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.bnum{margin-left:auto;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.body{font-size:14.5px;line-height:1.6;color:var(--ink2)}
.body>*+*{margin-top:11px}
.body b{color:var(--ink);font-weight:700}
.body ul{padding-left:19px}
.body li{margin:4px 0}
.body li::marker{color:var(--mute)}
code{font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace;font-size:.87em;
     background:var(--codebg);padding:1px 4px;border-radius:5px;border:1px solid var(--line)}
pre{font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace;
    font-size:12.4px;line-height:1.52;background:var(--codebg);border-left:3px solid var(--codeline);
    border-radius:0 8px 8px 0;padding:11px 13px;overflow-x:auto;
    white-space:pre;color:var(--ink);user-select:text;-webkit-user-select:text;
    /* [BOTH directions are required] pan-x alone disables vertical panning: once a finger lands on a code
       block (or a diagram, or code in fullscreen) the card can no longer be scrolled — two dead zones.
       With both allowed, the code block scrolls itself horizontally, and vertical, having nothing scrollable, bubbles up to the back face. */
    touch-action:pan-x pan-y;
    overscroll-behavior-x:contain}
pre .cl{display:block;min-height:1.52em;padding-left:var(--i,0);text-indent:-2ch}
body.wrap pre{overflow-x:hidden}
/* Cap the hanging indent in wrap mode: the deepest code indents 20 columns, and copying that leaves such a
   line a dozen usable characters on a phone, wrapped into mush. Horizontal-scroll mode is uncapped and shows the indent as-is. */
body.wrap pre .cl{white-space:pre-wrap;word-break:break-word;
  padding-left:min(var(--i,0), 11ch)}
.key,.warn{border-radius:0 9px 9px 0;padding:10px 13px;font-size:14px;line-height:1.55}
.key{background:var(--keybg);border-left:3px solid var(--keyline);color:var(--keyink)}
.warn{background:var(--warnbg);border-left:3px solid var(--warnline);color:var(--warnink)}
.key b,.warn b{color:inherit}
.cx{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;color:var(--mute);
    border-top:1px dotted var(--line);padding-top:9px}
table{border-collapse:collapse;width:100%;font-size:12.6px;line-height:1.45}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--chip);font-weight:700;color:var(--ink)}
/*__HL_LIGHT__*/
@media (prefers-color-scheme: dark){/*__HL_DARK__*/}
.more{display:flex;align-items:center;gap:10px;margin:18px 0 14px !important;
      font-size:10px;font-weight:750;letter-spacing:.16em;color:var(--mute)}
.more::before,.more::after{content:"";flex:1;height:1px;background:var(--line)}
/* ── Solution face has four fixed parts: ①pattern ②approach(+diagram) ③full implementation ④key takeaways ── */
/* The four body parts run full width (code blocks are never wide enough as it is); the two deep-dive parts are indented, so primary vs secondary reads at a glance */
.body>.dlab{margin-top:16px}
.body>.dlab:first-child{margin-top:0}
.idea{padding-left:0;list-style:none;counter-reset:s}
.idea li{position:relative;padding-left:26px;margin:7px 0;line-height:1.6}
.idea li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:1px;
  width:18px;height:18px;border-radius:50%;background:var(--chip);color:var(--mute);
  font-size:10.5px;font-weight:800;display:grid;place-items:center}
/* SVG diagrams: viewBox pins the logical coordinates, the card owns the width, crisp on any screen however narrow.
   None of fitDia's font-shrinking business — that exists to mop up after ASCII art; vectors don't need it. */
.figwrap{margin:9px 0 2px}
svg.fig{display:block;width:100%;height:auto}
svg.fig text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",
  "Hiragino Sans GB","Noto Sans CJK SC",system-ui,sans-serif}
svg.fig .m{font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace}
.diawrap{margin-top:10px;overflow-x:auto}
.diawrap.over{border-right:1px dashed var(--line)}
pre.dia{background:transparent;border-left:2px solid var(--line);border-radius:0;
  color:var(--mute);font-size:11.2px;line-height:1.62;padding:2px 0 2px 12px;
  white-space:pre;overflow:visible;
  width:max-content;min-width:100%}   /* stretch to content width and let the outer .diawrap do the horizontal scrolling */
.keys{padding-left:0;list-style:none}
.keys li{position:relative;padding-left:15px;margin:7px 0;line-height:1.58}
.keys li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;
  border-radius:50%;background:var(--mute)}
.dsec{border-left:2px solid var(--line);padding-left:12px}
.body>.dsec+.dsec{margin-top:15px}
.dlab{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
      color:var(--mute);margin-bottom:7px}
.jump{display:inline-flex;align-items:center;gap:6px;font-family:inherit;cursor:pointer;
      border:1px solid var(--jc);color:var(--jc);background:transparent;border-radius:999px;
      padding:4px 11px;font-size:12.5px;font-weight:700;transition:transform .12s}
.jump:active{transform:scale(.95)}
.jump i{font-style:normal;opacity:.65;font-weight:400}
.dwhy{margin-top:8px;font-size:13.5px;line-height:1.6;color:var(--ink2)}
.qa+.qa{margin-top:10px}
.qaq{font-size:13.5px;font-weight:700;color:var(--ink)}
.qaq::before{content:"Q ";color:var(--mute)}
.qaa{font-size:13px;line-height:1.58;color:var(--ink2);margin-top:2px}
.vr{display:flex;gap:10px;font-size:12.8px;line-height:1.5;padding:5px 0}
.vr+.vr{border-top:1px dotted var(--line)}
.vn{flex:0 0 46%;font-weight:700;color:var(--ink)}
.vd{flex:1;color:var(--ink2)}
/* Variant names are clickable: jump to the card if the deck has it (›), otherwise open LeetCode (↗).
   Not styled as buttons — four or five per screen, and borders would turn it into a wall of controls. */
a.vn,button.vn{font-family:inherit;font-size:inherit;text-align:left;background:none;
  border:none;padding:0;cursor:pointer;text-decoration:none;
  text-underline-offset:3px;text-decoration-color:var(--line)}
a.vn:hover,button.vn:hover{text-decoration:underline}
a.vn:active,button.vn:active{opacity:.55}
.vn i{font-style:normal;font-weight:400;color:var(--mute);margin-left:4px}
.prewrap{position:relative}
.prewrap .fade{position:absolute;top:0;right:0;bottom:0;width:30px;pointer-events:none;opacity:0;
  transition:opacity .2s;border-radius:0 8px 8px 0;
  background:linear-gradient(to right,var(--codebg0),var(--codebg) 82%)}
.prewrap.over .fade{opacity:1}
.prewrap.over::after{content:"⇄";position:absolute;right:6px;bottom:5px;font-size:10px;
  color:var(--mute);pointer-events:none}

/* ── footer ── */
/* The home indicator itself is only a few px tall and sits ~8px from the screen's bottom edge. Leaving the
   whole 34px safe area blank is wasteful; trimming a chunk still doesn't touch it, and the card gains a line of height. */
footer{flex:none;display:flex;gap:10px;
  padding:5px 16px max(8px, calc(env(safe-area-inset-bottom) - 16px))}
.act{
  flex:1;height:50px;border-radius:16px;border:1px solid var(--line);background:var(--card);
  color:var(--ink2);font-size:15px;font-weight:650;cursor:pointer;transition:transform .12s;
  font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px
}
.act:active{transform:scale(.96)}
.act.good{background:#0f766e;border-color:#0f766e;color:#fff}
@media (prefers-color-scheme: dark){.act.good{background:#12857b;border-color:#12857b}}

/* ── sheet ── */
.scrim{position:fixed;inset:0;background:rgba(8,10,14,.45);opacity:0;pointer-events:none;
       transition:opacity .22s;z-index:20;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);
  border-radius:22px 22px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:transform .28s cubic-bezier(.25,.9,.3,1);
  max-height:82%;overflow-y:auto
}
.sheet.on{transform:translateY(0)}
.build{text-align:center;font-size:10.5px;color:var(--mute);margin-top:16px;
  font-variant-numeric:tabular-nums;letter-spacing:.03em}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:6px auto 14px}
.sh{font-size:11px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);
     cursor:pointer;font-size:15.5px}
.row:last-child{border-bottom:none}
.sw{width:9px;height:9px;border-radius:50%;flex:none}
.rc{margin-left:auto;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.chk{width:21px;height:21px;border-radius:7px;border:1.5px solid var(--line);flex:none;
     display:grid;place-items:center;font-size:12px;color:transparent}
.chk.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
/* ── Code fullscreen ──
   A code block inside the card is limited by the card's width, and the paging gesture owns the x axis. Fullscreen
   has no paging, scrolls freely in both directions and lets you change the font size — long code is actually readable here. */
.codefs{display:none;position:fixed;inset:0;z-index:30;background:var(--card);
  flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.codefs.on{display:flex}
.cfhd{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-bottom:1px solid var(--line)}
.cft{flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--ink2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cfb{flex:none;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--ink2);font-family:inherit;font-size:13px;font-weight:650;
  cursor:pointer}
.cfb:active{transform:scale(.94)}
.cfb.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.cfx{width:34px;padding:0;font-size:15px}
.cfbody{flex:1;min-height:0;overflow:auto;
  padding:12px 14px;touch-action:pan-x pan-y}
#cfPre{font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace;
  background:transparent;border:none;border-radius:0;padding:0;
  font-size:13px;line-height:1.62;color:var(--ink);
  white-space:pre;width:max-content;min-width:100%;overflow:visible}
#cfPre .cl{display:block;padding-left:var(--i,0);text-indent:-2ch;min-height:1.62em}
.codefs.wrap #cfPre{white-space:pre-wrap;width:auto;word-break:break-word}
.codefs.wrap #cfPre .cl{padding-left:min(var(--i,0), 11ch)}
.cfhint{flex:none;text-align:center;font-size:11px;color:var(--mute);padding:6px 12px 12px}
/* Expand button: problem cards put it on the "③ full implementation" row; concept cards have no heading row, so it hangs on the code block's corner */
.codelab{display:flex;align-items:center;gap:8px}
.codelab .zoom{margin-left:auto;height:24px;padding:0 9px;border-radius:8px;
  border:1px solid var(--line);background:transparent;color:var(--mute);
  font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:.02em;
  cursor:pointer;text-transform:none}
.prewrap .zoom{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:9px;
  border:1px solid var(--line);background:var(--card);color:var(--mute);font-size:13px;
  line-height:1;display:grid;place-items:center;cursor:pointer;font-family:inherit;
  opacity:.85;z-index:2}
.zoom:active{transform:scale(.92)}

/* ── "Sync not connected" banner: silently degrading to local mode inside the standalone app is the nastiest failure of all, so it must be said out loud ── */
.nokey{display:none;position:fixed;left:12px;right:12px;z-index:22;
  top:calc(env(safe-area-inset-top) + 10px);
  background:var(--card);border:1px solid var(--warnline);border-radius:14px;
  box-shadow:var(--shadow);padding:12px 14px;font-size:13px;line-height:1.5}
.nokey.on{display:block}
.nokey b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:3px}
.nokey span{display:block;color:var(--mute)}
.nokey button{margin-top:9px;height:34px;padding:0 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--chip);color:var(--ink2);
  font-family:inherit;font-size:13px;font-weight:650;cursor:pointer}

/* ── Sync key input ── */
.krow{display:flex;gap:8px;margin-top:10px}
.krow input{flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-size:12.5px;padding:0 12px;outline:none}
.krow input:focus{border-color:var(--mute)}
.krow button{flex:none;height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--line);
  background:transparent;color:var(--ink2);font-family:inherit;font-size:14px;font-weight:650;
  cursor:pointer}
.krow button:active{transform:scale(.96)}
#keyShow{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px}

/* ── Review-by-topic panel ──
   Two hit areas per row: tap the name to expand every card in that topic, tap the ✓ on the right to toggle the filter only.
   They're separate because the two intents differ — one is "let me see what's in this topic",
   the other is "keep this topic in the deck". Crammed into the same tap target, both become hard to hit. */
.sgrp{border-bottom:1px solid var(--line)}
.sgh{display:flex;align-items:center;gap:10px;padding:11px 0;font-size:14.5px}
.sgh .nm{flex:1;min-width:0;display:flex;align-items:center;gap:10px;cursor:pointer}
.sgh .nm>.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sgh .car{flex:none;color:var(--mute);font-size:11px;width:12px;text-align:center;
  transition:transform .18s}
.sgrp.open .sgh .car{transform:rotate(90deg)}
.sgh .rc{flex:none}
.sgh .chk{flex:none;cursor:pointer;padding:0 2px}
.sgb{display:none;padding:2px 0 12px 22px}
.sgrp.open .sgb{display:block}
.only{width:100%;height:34px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--ink2);font-size:12.5px;font-family:inherit;
  font-weight:650;cursor:pointer;margin:2px 0 8px}
.only:active{transform:scale(.985)}
.citem{display:flex;align-items:center;gap:9px;padding:7px 0;cursor:pointer;font-size:13px}
.citem+.citem{border-top:1px dotted var(--line)}
.citem:active{opacity:.5}
.citem .st{flex:none;width:15px;text-align:center;font-size:11px;color:var(--mute)}
.citem .st.k{color:var(--keyline)}
.citem .st.t{color:var(--warnline)}
.citem .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--ink)}
.citem .tag{flex:none;font-size:10.5px;color:var(--mute);border:1px solid var(--line);
  border-radius:5px;padding:1px 5px;line-height:1.5}
.citem .tag.todo{color:var(--warnink);background:var(--warnbg);border-color:var(--warnline)}

/* ── Variants panel ── */
.vhint{font-size:12px;line-height:1.55;color:var(--mute);margin:-2px 0 8px}
.vhint b{color:var(--ink2)}
.vgrp{border-bottom:1px solid var(--line)}
.vgh{display:flex;align-items:center;gap:11px;padding:11px 0;cursor:pointer;font-size:14.5px}
.vgh .rc{margin-left:auto}
.vgh .car{color:var(--mute);font-size:11px;width:12px;text-align:center;transition:transform .18s}
.vgrp.open .vgh .car{transform:rotate(90deg)}
.vgb{display:none;padding:0 0 10px 20px}
.vgrp.open .vgb{display:block}
.vitem{display:flex;align-items:flex-start;gap:10px;padding:7px 0}
.vitem+.vitem{border-top:1px dotted var(--line)}
.vinfo{flex:1;min-width:0}
.vitem a{display:block;font-size:13.5px;font-weight:650;color:var(--ink);text-decoration:none}
.vitem a:active{opacity:.55}
.vitem a i{font-style:normal;font-weight:400;color:var(--mute);margin-left:5px;font-size:.85em}
.vfrom{font-size:11.5px;color:var(--mute);line-height:1.5;margin-top:2px}
.vadd{flex:none;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);
  background:transparent;color:var(--mute);font-size:15px;font-family:inherit;cursor:pointer;
  display:grid;place-items:center;line-height:1}
.vadd.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.vadd:active{transform:scale(.92)}
.wide{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:transparent;
      color:var(--ink2);font-size:15px;font-family:inherit;font-weight:600;margin-top:14px;cursor:pointer}
.done{position:absolute;inset:10px 14px 6px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);
      display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center}
.done.on{display:flex;z-index:6}
.done h2{font-size:26px;font-weight:750}
.done p{font-size:15px;color:var(--mute);line-height:1.6}

/* ── Desktop ───────────────────────────────────────────────────────
   On a phone the whole app fills the screen; on desktop it shrinks to a centred upright card with paging
   arrows left free on either side. Not one line of the touch logic changed; mouse dragging is a separate add-on. */
.nav{display:none}
.kbd{display:none}
@media (min-width:780px){
  body{background:var(--bg)}
  /* Shrink to a centred upright card on desktop instead of stretching across a whole 27-inch screen */
  #app{
    left:50%; right:auto; top:50%; bottom:auto;
    width:min(660px,100%); height:min(100%,880px);
    transform:translate(-50%,-50%)
  }
  .stage{padding:14px 16px 8px}
  .card{inset:14px 16px 8px;border-radius:24px}
  .done{inset:14px 16px 8px}
  .nav{
    display:grid;place-items:center;position:fixed;top:50%;transform:translateY(-50%);
    width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    color:var(--mute);font-size:26px;line-height:1;cursor:pointer;z-index:5;
    box-shadow:0 4px 14px rgba(16,20,28,.10);transition:color .15s,transform .12s,opacity .15s;
    font-family:inherit;padding-bottom:3px
  }
  .nav:hover{color:var(--ink);transform:translateY(-50%) scale(1.06)}
  .nav:active{transform:translateY(-50%) scale(.94)}
  .nav[disabled]{opacity:.3;cursor:default}
  .nav.prev{right:calc(50% + 348px)}
  .nav.next{left:calc(50% + 348px)}
  .kbd{
    display:flex;gap:14px;justify-content:center;align-items:center;flex:none;
    padding:0 16px 10px;font-size:11px;color:var(--mute);letter-spacing:.02em
  }
  .kbd kbd{
    font-family:inherit;font-size:10.5px;background:var(--chip);border:1px solid var(--line);
    border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink2);margin-right:4px
  }
}
@media (min-width:780px) and (max-width:1010px){
  .nav.prev{right:auto;left:8px} .nav.next{left:auto;right:8px}
}
.langrow{display:flex;gap:8px;padding:2px 0 10px}
.langrow .lang{
  flex:1;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--chip);
  color:var(--ink2);font:inherit;font-size:13.5px;cursor:pointer
}
.langrow .lang.on{background:var(--ink);color:var(--card);border-color:var(--ink);font-weight:600}
/* While mouse-dragging: don't let the browser treat it as a text selection */
body.dragging,body.dragging *{cursor:grabbing !important;user-select:none !important}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="hbtn" id="shuffle" aria-label="shuffle">⇄</button>
    <div class="hmid"><div class="hsec" id="hsec">—</div><div class="hcnt" id="hcnt">—</div></div>
    <button class="hbtn" id="menu" aria-label="menu">☰</button>
  </header>
  <div class="bar"><i id="prog" style="width:0%"></i></div>
  <div class="stage" id="stage">
    <!-- Two cards take turns being the "current card": the next one is rendered off-screen first, then slides in.
         With a single card, switching would have to be "push it away → repaint → push it back", and for
         those few hundred ms in between there is nothing on the stage — it looks exactly like loading. -->
    <div class="card" id="card"></div>
    <div class="card gone" id="card2"></div>
    <div class="done" id="done">
      <h2 data-t="done.title"></h2>
      <p id="donetxt"></p>
      <button class="wide" style="max-width:260px" id="again" data-t="done.again"></button>
    </div>
  </div>
  <footer>
    <button class="act" id="no" data-t="again"></button>
    <button class="act good" id="yes" data-t="got_it"></button>
  </footer>
  <div class="kbd" data-th="kbd"></div>
</div>
<button class="nav prev" id="navPrev" data-ta="nav.prev">‹</button>
<button class="nav next" id="navNext" data-ta="nav.next">›</button>

<div class="codefs" id="codefs">
  <div class="cfhd">
    <span class="cft" id="cfTitle"></span>
    <button class="cfb" id="cfWrap" data-t="code.wrap"></button>
    <button class="cfb" id="cfMinus" data-ta="code.smaller">A−</button>
    <button class="cfb" id="cfPlus" data-ta="code.larger">A+</button>
    <button class="cfb cfx" id="cfClose" data-ta="code.close">✕</button>
  </div>
  <div class="cfbody" id="cfBody"><pre id="cfPre"></pre></div>
  <div class="cfhint" data-t="code.hint"></div>
</div>
<div class="nokey" id="nokey">
  <b data-t="nokey.title"></b>
  <span data-t="nokey.text"></span>
  <button id="nokeyGo" data-t="nokey.go"></button>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sh" id="langSh"><span data-t="menu.language"></span></div>
  <div class="langrow" id="langRow"></div>
  <div class="sh" data-t="menu.types"></div>
  <div class="row" id="kindP"><span data-t="menu.kind_p"></span><span class="chk" style="margin-left:auto">✓</span></div>
  <div class="row" id="kindC"><span data-t="menu.kind_c"></span><span class="chk" style="margin-left:auto">✓</span></div>
  <div class="sh"><span data-t="menu.by_topic"></span> <span id="secN"></span></div>
  <div class="vhint" data-th="menu.by_topic_hint"></div>
  <div id="secs"></div>
  <div class="sh"><span data-t="menu.todo"></span> <span id="todoN"></span></div>
  <div class="row" id="onlyTodo"><span data-t="menu.only_todo"></span><span class="chk" style="margin-left:auto">✓</span></div>
  <div id="todoList"></div>
  <button class="wide" id="copyTodo" data-t="menu.copy_todo"></button>
  <div class="sh"><span data-t="menu.variants"></span> <span id="varN"></span></div>
  <div class="vhint" data-th="menu.variants_hint"></div>
  <div id="varList"></div>
  <div class="sh" data-t="menu.sync"></div>
  <div class="row" id="syncRow"><span id="syncTxt">—</span><span class="rc" id="keyShow"></span></div>
  <div class="krow">
    <input id="keyIn" data-tp="menu.key_placeholder" autocapitalize="off"
           autocorrect="off" spellcheck="false" autocomplete="off">
    <button id="keySet" data-t="menu.connect"></button>
  </div>
  <button class="wide" id="syncLink" data-t="menu.copy_link"></button>
  <div class="row" id="copyKey"><span data-t="menu.copy_key"></span><span class="rc" data-t="menu.key_len"></span></div>
  <button class="wide" id="restore" data-t="menu.restore_local"></button>
  <!-- Progress lives in localStorage, which is partitioned by origin: change the domain (new host, new custom
       domain) and the old data is unreachable. With export/import, progress follows the person and depends on no server. -->
  <button class="wide" id="expProg" data-t="menu.export"></button>
  <div class="krow">
    <input id="impIn" data-tp="menu.import_placeholder" autocapitalize="off"
           autocorrect="off" spellcheck="false" autocomplete="off">
    <button id="impSet" data-t="menu.import"></button>
  </div>
  <div class="sh" data-t="menu.options"></div>
  <div class="row" id="onlyUnknown"><span data-t="menu.only_unknown"></span><span class="chk" style="margin-left:auto">✓</span></div>
  <div class="row" id="shuffleRow"><span data-t="menu.shuffle"></span><span class="chk" style="margin-left:auto">✓</span></div>
  <div class="row" id="wrapRow"><span data-t="menu.wrap"></span><span class="chk" style="margin-left:auto">✓</span></div>
  <button class="wide" id="reset" data-t="menu.reset"></button>
  <!-- One line of diagnostics: the real viewport and safe-area numbers. Inside an iOS home-screen app they differ
       from the browser's, and you can't see or inspect them, so bugs are pure guesswork. Print them and a single screenshot pins it down. -->
  <div class="build"><span id="build"></span><span id="vp"></span>
    <br><a href="https://github.com/SitianLu/grindcards" target="_blank" rel="noopener">GrindCards · source (AGPL-3.0)</a></div>
</div>

<script>
/* Every language is baked in; switching swaps CARDS/VARIANTS in place.
   Card titles and order are identical across languages (the build asserts it),
   so progress keyed by title survives a switch untouched. */
const DECKS = __DECKS__;
const VARS = __VARIANTS__;          // variants are deliberately not in CARDS: menu-only
const SECTIONS = __SECTIONS__;
const I18N = __I18N__;
const LANGS = __LANGS__;            // [[code, display name], ...]
const DEFAULT_LANG = __LANG__;
const BUILD = __BUILD__;            // {lang: stamp}
const HTML_LANG = {zh: 'zh-CN'};
const LKEY = 'gc_lang';
function pickLang(){
  let l = '';
  try{ l = localStorage.getItem(LKEY) || ''; }catch(e){}
  return DECKS[l] ? l : DEFAULT_LANG;
}
let LANG = pickLang();
let CARDS = DECKS[LANG], VARIANTS = VARS[LANG];
let VMAP = new Map(VARIANTS.map(v=>[v.lc, v]));
/* T('menu.todo') / T('done.text', {k, n}) — every UI string goes through here. */
function T(k, kw){
  let s = (I18N[LANG] && I18N[LANG][k]) || (I18N.en && I18N.en[k]) || k;
  if(kw) for(const [a, b] of Object.entries(kw)) s = s.split('{' + a + '}').join(b);
  return s;
}
/* Static chrome carries data-t (text) / data-th (html) / data-ta (aria-label) /
   data-tp (placeholder); re-run after a switch and the whole shell re-labels. */
function applyI18n(){
  document.documentElement.lang = HTML_LANG[LANG] || LANG;
  document.querySelectorAll('[data-t]').forEach(n => n.textContent = T(n.dataset.t));
  document.querySelectorAll('[data-th]').forEach(n => n.innerHTML = T(n.dataset.th));
  document.querySelectorAll('[data-ta]').forEach(n => n.setAttribute('aria-label', T(n.dataset.ta)));
  document.querySelectorAll('[data-tp]').forEach(n => n.placeholder = T(n.dataset.tp));
  const b = document.getElementById('build'); if(b) b.textContent = BUILD[LANG] || BUILD[DEFAULT_LANG] || '';
  const host = document.getElementById('langRow');
  if(host){
    host.innerHTML = '';
    LANGS.forEach(([code, name]) => {
      const btn = document.createElement('button');
      btn.className = 'lang' + (code === LANG ? ' on' : '');
      btn.textContent = name;
      btn.onclick = () => setLang(code);
      host.appendChild(btn);
    });
    document.getElementById('langSh').hidden = LANGS.length < 2;
    host.hidden = LANGS.length < 2;
  }
}

/* ---------- storage (never throws) ---------- */
const KEY='gc_v1'; let mem={};
const store={
  get(){
    try{
      const v = localStorage.getItem(KEY);
      if(v) return JSON.parse(v)||{};
      const old = localStorage.getItem('cf_v1');        // pre-GrindCards builds
      return old ? JSON.parse(old)||{} : {};
    }catch(e){ return mem; }
  },
  set(v){ try{ localStorage.setItem(KEY,JSON.stringify(v)); }catch(e){ mem=v; } }
};
/* Progress is keyed by CARD TITLE, not by index. The build emits cards sorted by section, so a new card
   added to the deck bumps the index of every card after it — keying by index would reshuffle progress on the next rebuild.
   Each entry carries its own timestamp; a cross-device merge takes the newer one, entry by entry.
   Filter preferences (section / concept-vs-problem / only unknown / only to-do / shuffle) sync as well:
   they decide "which batch am I drilling right now" — tune it on the phone, open the laptop, it should be the same batch.
   [wrap (code soft-wrap) is deliberately NOT synced] it's a function of screen width, not of intent:
   on for a narrow phone, off for a wide desktop; syncing it means every adjustment on one device breaks the other. */
let S = Object.assign({cards:{},todoM:{},secs:[],kinds:[],onlyTodo:false,
                       onlyUnknown:false,shuffled:false,wrap:true,prefsAt:0,
                       seed:0,viewCard:'',viewAt:0}, store.get());

/* Preferences are replaced as a whole block (unlike cards, which merge entry by entry) — they're interrelated,
   and picking the newest of each separately would assemble a combination nobody ever set. One timestamp for the block; newest wins. */
// seed and shuffled must travel together: syncing "shuffle is on" without syncing the seed means
// the two devices each shuffle their own way and the orders still don't match.
const PREF_KEYS = ['secs','kinds','onlyTodo','onlyUnknown','shuffled','seed'];
function prefsOut(){
  const o = {t: S.prefsAt || 0};
  PREF_KEYS.forEach(k => o[k] = S[k]);
  return o;
}
function applyPrefs(p){
  if(!p || typeof p !== 'object') return false;
  if((Number(p.t) || 0) <= (S.prefsAt || 0)) return false;   // local is newer, leave it alone
  PREF_KEYS.forEach(k => { if(p[k] !== undefined) S[k] = p[k]; });
  S.prefsAt = Number(p.t) || 0;
  return true;
}

const now = ()=>Date.now();
let IDX = new Map(CARDS.map((c,i)=>[c.t,i]));

function setLang(code){
  if(!DECKS[code] || code === LANG) return;
  LANG = code;
  try{ localStorage.setItem(LKEY, code); }catch(e){}
  CARDS = DECKS[LANG]; VARIANTS = VARS[LANG];
  VMAP = new Map(VARIANTS.map(v=>[v.lc, v]));
  IDX = new Map(CARDS.map((c,i)=>[c.t,i]));
  applyI18n();
  buildDeck(true); paint(); renderSecs();
}

if(Array.isArray(S.known)){          // one-time migration from the old format (index array)
  const t=now();
  S.known.forEach(i=>{ const c=CARDS[i]; if(c) S.cards[c.t]={k:1,t}; });
  delete S.known;
}
if(Array.isArray(S.todo)){
  const t=now();
  S.todo.forEach(lc=>{ S.todoM[String(lc)]={v:1,t}; });
  delete S.todo;
}

const known = new Set();             // the runtime still uses indices; not one line of the render code changed
const todo  = new Set();
function hydrate(){
  known.clear(); todo.clear();
  for(const [title,e] of Object.entries(S.cards||{}))
    if(e && e.k && IDX.has(title)) known.add(IDX.get(title));
  for(const [lc,e] of Object.entries(S.todoM||{})) if(e && e.v) todo.add(+lc);
}
hydrate();
document.body.classList.toggle('wrap', S.wrap!==false);

/* Un-marking "got it" must still leave a k:0 tombstone, otherwise the old k:1 pushes it back on merge */
function setKnown(i, on){
  const t = CARDS[i] && CARDS[i].t; if(!t) return;
  S.cards[t] = {k: on?1:0, t: now()};
  on ? known.add(i) : known.delete(i);
}
function setTodo(lc, on){
  S.todoM[String(lc)] = {v: on?1:0, t: now()};
  on ? todo.add(lc) : todo.delete(lc);
}
function clearKnown(){
  const t=now();
  known.forEach(i=>{ const k=CARDS[i] && CARDS[i].t; if(k) S.cards[k]={k:0,t}; });
  known.clear();
}

let dirty = false;
const save = ()=>{ store.set(S); dirty = true; backup(); schedulePush(); };
/* Preference changes go through this one — without the timestamp, the other device forever believes its own copy is newer */
const savePrefs = ()=>{ S.prefsAt = now(); save(); };

/* ---------- deck ---------- */
let deck=[], pos=0, flipped=false, busy=false;

function buildDeck(keepCurrent){
  const cur = deck[pos];
  let ids = CARDS.map((c,i)=>i);
  if(S.kinds.length) ids = ids.filter(i=>S.kinds.includes(CARDS[i].k));
  if(S.secs.length) ids = ids.filter(i=>S.secs.includes(CARDS[i].s));
  if(S.onlyUnknown) ids = ids.filter(i=>!known.has(i));
  if(S.onlyTodo)    ids = ids.filter(i=>todo.has(CARDS[i].lc));
  if(!ids.length){ ids = CARDS.map((c,i)=>i).filter(i=>!S.secs.length||S.secs.includes(CARDS[i].s)); }
  // [Shuffle with a seed, not Math.random] same seed + same set of cards = same order,
  // so "the order" only needs a single integer synced, not a whole index array —
  // and an index array goes stale anyway: a new card added to the deck shifts every index after it.
  if(S.shuffled){
    const r = rng(S.seed || 1);
    for(let i=ids.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
  }
  deck = ids;
  pos = keepCurrent && deck.includes(cur) ? deck.indexOf(cur) : 0;
  if(pos<0) pos=0;
}

/* mulberry32: deterministic pseudo-random numbers from a 32-bit seed — ten lines, no dependencies, identical results across browsers. */
function rng(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const newSeed = ()=> (Date.now() ^ Math.floor(Math.random()*0x7fffffff)) >>> 0;

/* [Position stores a title, not an index] same reason as progress: the deck keeps growing, indices
   shift wholesale, and a stored index lands you on a different card once a new card is added.
   Timestamp only when the user actually changes card — the render on page open doesn't count as "I moved",
   otherwise every device overwrites the remote's real position with "I'm on card 1" the moment it boots. */
function noteView(){
  const c = CARDS[deck[pos]]; if(!c || S.viewCard === c.t) return;
  S.viewCard = c.t; S.viewAt = now();
  store.set(S); schedulePush();
}
function viewOut(){ return {card: S.viewCard || '', t: S.viewAt || 0}; }
function applyView(v){
  if(!v || !v.card) return false;
  if((Number(v.t) || 0) <= (S.viewAt || 0)) return false;
  S.viewCard = v.card; S.viewAt = Number(v.t) || 0;
  const idx = IDX.get(v.card);
  if(idx === undefined) return false;              // this card doesn't exist in this version
  const i = deck.indexOf(idx);
  if(i < 0) return false;                          // filtered out by the current filters
  pos = i; flipped = false; shown = 0;
  return true;
}

/* ---------- render ---------- */
const el = s=>document.querySelector(s);
const MOUSE = matchMedia('(pointer:fine)').matches;   // desktop: copy says "click/drag" instead of "tap/swipe"
const stage=el('#stage'), doneBox=el('#done');
/* Two card layers. card always points at "the one being looked at"; other() is the spare layer:
   on switch/flip the new content is painted into the spare first (it's off-screen at that point, the user can't see it),
   and only then do both layers move together — the stage has content at every instant, no more blank screen. */
const cardA=el('#card'), cardB=el('#card2');
let card = cardA;
const other = ()=> card===cardA ? cardB : cardA;
let peerDir = 0;          // which side the card parked at the edge is on (0 = none)

function faceHTML(c, back){
  const prob = c.k === 'P';
  const fc = prob ? 'var(--mute)' : c.c;          // front must not leak the pattern
  if(!back) return `<div class="accent" style="background:${fc}"></div>
    <div class="face">
      <div class="fsec" style="color:${fc}">${prob ? T('problem') : c.s}</div>
      <div class="ftitle">${c.t}${c.tag ? `<span class="mbadge">${c.tag}</span>` : ''}</div>
      <div class="frule" style="background:${fc}"></div>
      <div class="hookwrap${prob ? ' top' : ''}"><div class="hook">${c.h}</div></div>
      ${prob ? toolsHTML(c) : ''}
      <div class="hint2">${T((prob ? 'flip.p_' : 'flip.c_') + (MOUSE ? 'mouse' : 'touch'))}</div>
    </div>`;
  return `<div class="accent" style="background:${c.c}"></div>
    <div class="face scroll">
      <div class="btitle"><span class="dot" style="background:${c.c}"></span><span class="pat" style="color:${c.c}">${prob ? c.s : c.t}</span>
        <span class="bnum">${String(c.n).padStart(2,'0')}</span></div>
      <div class="body">${c.b}</div>
    </div><div class="cue">⌄</div>`;
}

/* A diagram must be taken in at a glance; horizontal scrolling defeats the point — shrink until the whole figure fits the card width */
function fitDia(root){
  root.querySelectorAll('.diawrap').forEach(w=>{
    const d = w.querySelector('.dia'); if(!d) return;
    let fs = 11.2, g = 0;
    d.style.fontSize = fs + 'px';
    while(w.scrollWidth > w.clientWidth + 1 && fs > 8.2 && g++ < 40){
      fs -= 0.25; d.style.fontSize = fs + 'px';
    }
    w.classList.toggle('over', w.scrollWidth > w.clientWidth + 1);
  });
}

/* One monospace character's width = font size × a fixed ratio; measuring once is enough, every card afterwards just computes it. */
let MONO = 0;
function monoRatio(){
  if(MONO) return MONO;
  const t=document.createElement('span');
  t.style.cssText='position:absolute;visibility:hidden;white-space:pre;font-size:100px;'+
    'font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace';
  t.textContent='0'.repeat(50);
  document.body.appendChild(t);
  MONO = t.getBoundingClientRect().width / 50 / 100;
  t.remove();
  return MONO;
}

function fitCode(root){
  const wrapMode=document.body.classList.contains('wrap');
  const ratio=monoRatio();
  root.querySelectorAll('.body pre:not(.dia)').forEach(p=>{   // .dia belongs to fitDia; don't wrap it twice
    if(!p.parentElement.classList.contains('prewrap')){
      const w=document.createElement('div'); w.className='prewrap';
      p.parentNode.insertBefore(w,p); w.appendChild(p);
      const f=document.createElement('span'); f.className='fade'; w.appendChild(f);
      if(!(w.previousElementSibling && w.previousElementSibling.classList.contains('codelab'))){
        const z=document.createElement('button'); z.className='zoom ctl'; z.type='button';
        z.textContent='⤢'; z.setAttribute('aria-label',T('code.expand_aria')); w.appendChild(z);
      }
    }
    // This used to be "shrink 0.3px, measure, shrink again" looped up to 40 times, each a forced synchronous layout;
    // one solution face burned 35ms right here, exactly at the moment you flip the card and go to swipe.
    // Now the widest column count is written into data-w at build time and the font size is computed in one go.
    const cols = +(wrapMode ? p.dataset.ww : p.dataset.w) || 44;
    const cs = getComputedStyle(p);
    const avail = p.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const min = wrapMode ? 9.6 : 9.8;
    let fs = Math.max(min, Math.min(12.4, avail / (cols * ratio)));
    p.style.fontSize = fs.toFixed(2) + 'px';
    // Then measure once to correct. Font fallback (CJK text goes through a different set of glyphs) skews the estimate,
    // and a single scrollWidth read fixes it — far cheaper than the forty measurements before.
    if(!wrapMode && p.scrollWidth > p.clientWidth + 1){
      fs = Math.max(min, fs * p.clientWidth / p.scrollWidth);
      p.style.fontSize = fs.toFixed(2) + 'px';
    }
    p.parentElement.classList.toggle('over', !wrapMode && p.scrollWidth > p.clientWidth + 1);
  });
}

let shown = 0;                       // hints revealed on the current card

function toolsHTML(c){
  const hs = c.hints || [];
  const chips = hs.map((_, i) =>
    `<button class="hbtn2 ctl ${i < shown ? 'used' : ''}" data-h="${i}">${i+1}</button>`).join('');
  const body = hs.slice(0, shown).map((h, i) =>
    `<div class="hint"><u>${T('hint.show', {n: i+1})}</u>${h}</div>`).join('');
  const inList = todo.has(c.lc);
  return `<div class="tools">
    <div class="hrow"><span class="hlab">${T('hint.label')}</span>${chips}</div>
    ${body}
    <div class="arow">
      <a class="abtn ctl" target="_blank" rel="noopener"
         href="https://leetcode.com/problems/${c.slug}/">${T('hint.leetcode')}</a>
      <button class="abtn ctl todo ${inList ? 'on' : ''}">${T(inList ? 'hint.in_todo' : 'hint.add_todo')}</button>
    </div></div>`;
}

function bindTools(c, root){
  root.querySelectorAll('.hbtn2').forEach(b => b.onclick = e => {
    e.stopPropagation();
    shown = Math.max(shown, +b.dataset.h + 1);
    paint();
  });
  const tb = root.querySelector('.todo');
  if(tb) tb.onclick = e => {
    e.stopPropagation();
    setTodo(c.lc, !todo.has(c.lc));
    save(); paint(); renderSecs();
  };
}

/* ---------- code fullscreen ---------- */
const codefs = el('#codefs');
let cfSize = 13;
function openCode(pre){
  el('#cfPre').innerHTML = pre.innerHTML;      // highlight markup carried over as-is
  const c = CARDS[deck[pos]];
  el('#cfTitle').textContent = c ? c.t : '';
  codefs.classList.toggle('wrap', document.body.classList.contains('wrap'));
  el('#cfWrap').classList.toggle('on', codefs.classList.contains('wrap'));
  el('#cfPre').style.fontSize = cfSize + 'px';
  el('#cfBody').scrollTop = 0; el('#cfBody').scrollLeft = 0;
  codefs.classList.add('on');
}
function closeCode(){ codefs.classList.remove('on'); }
el('#cfClose').onclick = closeCode;
el('#cfWrap').onclick = ()=>{
  codefs.classList.toggle('wrap');
  el('#cfWrap').classList.toggle('on', codefs.classList.contains('wrap'));
};
const setSize = d => {
  cfSize = Math.min(22, Math.max(9, cfSize + d));
  el('#cfPre').style.fontSize = cfSize + 'px';
};
el('#cfPlus').onclick  = ()=>setSize(1);
el('#cfMinus').onclick = ()=>setSize(-1);

/* Deep dive → the pattern chip jumps to the matching concept card. If that concept card is filtered out by
   section/kind, splice it in temporarily after the current card rather than overriding the user's filters. */
function bindDeep(root){
  root.querySelectorAll('.zoom').forEach(z => z.onclick = e => {
    e.stopPropagation();
    const host = z.classList.contains('ctl') && z.parentElement.classList.contains('codelab')
      ? z.parentElement.nextElementSibling      // heading row -> the code block below it
      : z.parentElement;                        // corner button -> its own prewrap
    const pre = host && host.querySelector ? host.querySelector('pre') : null;
    if(pre) openCode(pre);
  });
  root.querySelectorAll('.jump, .vgo[data-i]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    goToCard(+b.dataset.i);
  });
  // the variant row is an <a>; let its default action open LeetCode, just don't let the click bubble up into a flip
  root.querySelectorAll('a.vgo').forEach(a => a.onclick = e => e.stopPropagation());
}

/* Jump to a card. If it's filtered out by section/kind, splice it in temporarily after the current card
   rather than overriding the user's filters. */
function goToCard(idx){
  let i = deck.indexOf(idx);
  if(i < 0){ deck.splice(pos+1, 0, idx); i = pos+1; }
  pos = i; flipped = false; shown = 0;
  doneBox.classList.remove('on');
  paint(); noteView();
}

/* A concept card's hook is a one-line question; the big type itself is the point.
   A problem card's hook is a paragraph of statement; the same big type smears across the whole card and is tiring to read — start one size smaller. */
function fitHook(root, idx){
  const w=root.querySelector('.hookwrap'), h=root.querySelector('.hook');
  if(!w||!h) return;
  const prob = (CARDS[idx]||{}).k === 'P';
  let fs = prob ? 18 : 24, min = prob ? 13.5 : 15, g = 0;
  h.style.fontSize=fs+'px';
  while(h.scrollHeight>w.clientHeight && fs>min && g++<60){ fs-=0.5; h.style.fontSize=fs+'px'; }
}

function cue(root){
  const f=root.querySelector('.face.scroll'); if(!f) return;
  // scrollHeight doesn't change during a scroll, yet reading it is a forced synchronous layout — reading it every
  // frame stalls the main thread every frame. Compute it once here, when this card has finished rendering.
  const canScroll = f.scrollHeight > f.clientHeight + 4;
  let shown = null;
  const upd = ()=>{
    const want = canScroll && f.scrollTop < 16;
    if(want === shown) return;          // don't touch the class if the state hasn't changed; saves a style recalc of the whole card
    shown = want;
    root.classList.toggle('hasmore', want);
  };
  upd(); f.addEventListener('scroll', upd, {passive:true});
}

/* Render a card into a layer. Note it never touches pos / flipped — what gets painted into the spare layer
   is usually NOT the "current card"; global state changes only when the animation actually switches over. */
function renderFace(root, idx, back){
  const c = CARDS[idx]; if(!c) return;
  root.innerHTML = faceHTML(c, back);
  if(back){ fitCode(root); fitDia(root); cue(root); bindDeep(root); }
  else { if(c.k === 'P') bindTools(c, root); fitHook(root, idx); root.classList.remove('hasmore'); }
}

function paint(){
  if(!deck.length){ return; }
  renderFace(card, deck[pos], flipped);
  paintChrome();
}

/* Top bar, progress bar, buttons — they follow the "current card" and are kept separate from face rendering,
   so at the instant of an animated switch only they need updating. */
function paintChrome(){
  if(!deck.length) return;
  const c = CARDS[deck[pos]];
  const isP = c.k === 'P';
  el('#hsec').textContent = isP && !flipped ? T('problem') : c.s;
  el('#hsec').style.color = isP && !flipped ? 'var(--mute)' : c.c;
  el('#hcnt').textContent = `${pos+1} / ${deck.length}　·　${T('known_count', {k: known.size, n: CARDS.length})}`;
  const p = el('#prog');
  p.style.width = ((pos+1)/deck.length*100)+'%';
  p.style.background = (isP && !flipped) ? 'var(--mute)' : c.c;
  el('#navPrev').disabled = pos <= 0;
  el('#navNext').disabled = pos >= deck.length - 1;
}

/* Animation wrap-up: restore both layers to a known state, idle layer back to display:none.
   Every path must end by going through this, or the card is left hanging mid-air. */
function settle(){
  bump();
  [cardA, cardB].forEach(c=>{
    c.style.transition=''; c.style.transform=''; c.style.opacity=''; c.style.zIndex='';
    c.classList.remove('anim','slide','hold');
  });
  const idle = other();
  idle.classList.add('gone'); idle.innerHTML='';   // idle layer emptied; the previous card can never linger
  card.classList.remove('gone');
  peerDir = 0; busy = false;
}

/* Generation counter for the wrap-up: any new action (flip, switch, starting another drag) bumps it once,
   voiding the settle queued by the previous round. Otherwise, on "drag, release, drag again immediately",
   the previously queued settle wipes the spare layer in the middle of the new drag. */
let gen = 0, watchdog = 0;
function bump(){ clearTimeout(watchdog); return ++gen; }
/* Settle after ms; also arm a 1.2s fallback alarm so that any path that never reaches settle
   can't leave the card parked off-screen forever. */
function settleIn(ms){
  const g = bump();
  const fire = ()=>{ if(g===gen) settle(); };
  setTimeout(fire, ms);
  watchdog = setTimeout(fire, 1200);
}

/* [Why two layers, instead of one card moving itself]
   With one card, switching can only be "push away → repaint → push back", and the repaint has to wait for the
   push-away animation to finish (or the user sees the content mutate in front of their eyes), so the stage is
   inevitably empty for half a second in between — that's the "half-second loading after every swipe".
   Two layers: the new card is painted into the off-screen spare first, then both slide together; the user sees content the whole time.

   [Don't use requestAnimationFrame to set the "start position"]
   iOS defers or outright drops rAF around gestures, when the page is covered, or under memory pressure; once
   dropped, the card is parked out of sight forever. Force a reflow instead: read offsetWidth once in the same task
   so the previous line lands immediately, then write the end state directly on the next line — no dependence on a callback ever being scheduled. */
function flip(){
  if(busy) return;
  busy = true;
  const out = card, inc = other(), nf = !flipped;
  // paint first: inc is already turned edge-on to the user and invisible, so painting can take as long as it likes
  inc.classList.remove('gone');
  inc.style.transition='none';
  inc.style.transform='rotateY(-90deg) scale(.96)';
  inc.style.opacity='.6';        // don't dim too far: mid-flip the card is already edge-on and invisible anyway;
                                 // stacking translucency on top reads as "it went dark for a moment" instead of "it flipped over"
  inc.style.zIndex='2'; out.style.zIndex='1';
  renderFace(inc, deck[pos], nf);
  void inc.offsetWidth;                       // start pose lands immediately
  out.classList.add('anim');
  out.style.transform='rotateY(90deg) scale(.96)'; out.style.opacity='.6';
  setTimeout(()=>{
    card = inc; flipped = nf;
    out.style.opacity='0';
    inc.classList.add('anim');
    inc.style.transition='';
    // Turning out uses ease-in (slow start, fast fling); turning back in MUST be ease-out:
    // with ease-in on both halves the new card "slowly rises up from edge-on", dawdling longest in exactly
    // the few near-invisible degrees, and the flip reads as another blackout.
    inc.style.transitionTimingFunction='ease-out';
    inc.style.transform='rotateY(0deg) scale(1)'; inc.style.opacity='1';
    paintChrome();
    settleIn(200);
  },160);
}

function go(dir){
  if(busy) return;
  const next = pos + dir;
  if(next<0 || next>=deck.length){
    card.style.transition='transform .16s'; card.style.transform=`translateX(${dir*-14}px)`;
    setTimeout(()=>{card.style.transform='';setTimeout(()=>card.style.transition='',160);},160);
    if(next>=deck.length) finish();
    return;
  }
  busy = true;
  const out = card, inc = other();
  // During a drag the next card has most likely already been painted and parked at the edge (peerDir), so just
  // carry on from it: finger-up to card-in-place is one continuous motion, not a single frame of waiting.
  if(peerDir !== dir){
    inc.classList.remove('gone');
    inc.style.transition='none'; inc.style.opacity='1';
    inc.style.transform=`translateX(${dir*112}%)`;
    renderFace(inc, deck[next], false);
  }
  inc.style.zIndex='2'; out.style.zIndex='1';
  void inc.offsetWidth;
  card = inc; pos = next; flipped = false; shown = 0; peerDir = 0;
  paintChrome(); noteView();
  out.classList.add('slide'); inc.classList.add('slide');
  inc.style.transition=''; inc.style.transform='translateX(0) rotate(0)'; inc.style.opacity='1';
  out.style.transform=`translateX(${dir*-112}%) rotate(${dir*-4}deg)`; out.style.opacity='.2';
  settleIn(280);
}

function finish(){
  doneBox.classList.add('on');
  el('#donetxt').textContent = T('done.text', {k: known.size, n: CARDS.length}) + (S.onlyUnknown ? T('done.text_unknown') : '');
}

function mark(ok){
  shown = 0;
  setKnown(deck[pos], ok); save();
  if(pos>=deck.length-1){ paint(); finish(); } else go(1);
}

/* ---------- gestures: swipe left/right between cards ----------
   Code blocks do NOT take part in the card gesture: a horizontal swipe on a <pre> scrolls code, not cards. That way
   wide code can be nudged inside the card; to really see all of it, ⤢ top-right opens fullscreen (no paging gesture there to fight over the axis). */
let sx=0, sy=0, st=0, drag=false, lock=null;
let onCtl=false;
const noSwipe = t => t && t.closest && (t.closest('.ctl') || t.closest('pre'));

/* Halfway through a drag the next card is already parked at the screen edge following the finger —
   you can glimpse it before letting go, and after letting go it keeps moving; there is no such thing as "waiting for it to load". */
function preparePeer(dir){
  if(peerDir === dir) return;
  const idle = other(), next = pos + dir;
  peerDir = 0;
  idle.classList.add('gone');
  if(next < 0 || next >= deck.length) return;     // at the end; no next card to park at the edge
  bump();                                          // void any queued settle
  idle.classList.remove('gone');
  idle.style.transition='none'; idle.style.opacity='1';
  idle.style.transform=`translateX(${dir*112}%)`;
  idle.style.zIndex='1'; card.style.zIndex='2';
  renderFace(idle, deck[next], false);
  peerDir = dir;
}

function dragCard(dx){
  card.classList.add('hold');
  card.style.transition='none';
  card.style.transform=`translateX(${dx}px) rotate(${dx*0.035}deg)`;
  card.style.opacity = String(Math.max(.45, 1-Math.abs(dx)/460));
  if(peerDir){
    const p = other();
    p.style.transition='none';
    p.style.transform=`translateX(${peerDir*112}%) translateX(${dx}px)`;
  }
}
function releaseCard(){
  card.style.transition='transform .2s,opacity .2s';
  card.style.transform=''; card.style.opacity='';
  if(peerDir){
    const p = other();
    p.style.transition='transform .2s';
    p.style.transform=`translateX(${peerDir*112}%)`;
  }
  settleIn(200);
}

stage.addEventListener('touchstart', e=>{
  if(busy||doneBox.classList.contains('on')) return;
  onCtl = !!noSwipe(e.target);
  if(onCtl) return;                       // buttons and code blocks handle themselves
  bump();                                 // void the wrap-up queued by the last release; don't reset the card in the middle of this drag
  const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now(); drag=true; lock=null;
},{passive:true});

/* [MUST be passive] A non-passive touchmove makes the browser wait for JS to return on every single frame
   before it can scroll, so vertical scrolling feels gritty — especially costly on the content-heavy solution face.
   No more preventDefault; the touch-action above guarantees the browser keeps its hands off the horizontal axis. */
stage.addEventListener('touchmove', e=>{
  if(!drag) return;
  const t=e.touches[0], dx=t.clientX-sx, dy=t.clientY-sy;
  if(lock===null){
    if(Math.abs(dx)<6 && Math.abs(dy)<6) return;
    lock = Math.abs(dx) > Math.abs(dy)*1.4 ? 'x' : 'y';   // vertical is left to the back face's scrolling
  }
  if(lock!=='x') return;
  preparePeer(dx<0 ? 1 : -1);      // dragging back the other way swaps in the card from the other side
  dragCard(dx);
},{passive:true});

stage.addEventListener('touchend', e=>{
  if(!drag) return; drag=false;
  const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy, dt=Date.now()-st;
  card.style.transition='';
  if(lock==='x' && (Math.abs(dx)>62 || (Math.abs(dx)>28 && dt<250))){
    card.style.transform=''; card.style.opacity='';
    go(dx<0?1:-1); return;
  }
  if(lock==='x') releaseCard();
  if(lock===null && dt<320 && Math.abs(dx)<10 && Math.abs(dy)<10) flip();
},{passive:true});

/* ---------- mouse: drag to switch cards + click to flip (desktop) ----------
   The touch path uses touch events, not one of which a mouse ever receives, so cards couldn't be swiped on desktop. */
let msx=0, msy=0, mst=0, mdrag=false, mlock=null, mfar=false;

stage.addEventListener('mousedown', e=>{
  if(!MOUSE) return;      // iOS also fires a set of synthetic mouse events after a tap; don't let them cut into the flip animation
  if(e.button!==0 || busy || doneBox.classList.contains('on')) return;
  if(noSwipe(e.target)) return;
  bump();
  msx=e.clientX; msy=e.clientY; mst=Date.now(); mdrag=true; mlock=null; mfar=false;
});
addEventListener('mousemove', e=>{
  if(!mdrag) return;
  const dx=e.clientX-msx, dy=e.clientY-msy;
  if(mlock===null){
    if(Math.abs(dx)<6 && Math.abs(dy)<6) return;
    mlock = Math.abs(dx) > Math.abs(dy)*1.4 ? 'x' : 'y';
    if(mlock==='x') document.body.classList.add('dragging');
  }
  if(mlock!=='x') return;
  e.preventDefault(); mfar = mfar || Math.abs(dx)>10;
  preparePeer(dx<0 ? 1 : -1);
  dragCard(dx);
});
addEventListener('mouseup', e=>{
  if(!mdrag) return; mdrag=false;
  document.body.classList.remove('dragging');
  const dx=e.clientX-msx, dt=Date.now()-mst;
  card.style.transition='';
  if(mlock==='x' && (Math.abs(dx)>62 || (Math.abs(dx)>28 && dt<250))){
    card.style.transform=''; card.style.opacity='';
    go(dx<0?1:-1); return;
  }
  if(mlock==='x') releaseCard();
});

stage.addEventListener('click', e=>{
  if(!MOUSE) return;                                // touch goes through the touchend path
  if(doneBox.classList.contains('on')) return;
  if(mfar){ mfar=false; return; }                   // just finished a drag; don't flip on the way out
  if(e.target.closest && e.target.closest('.ctl')) return;
  if(window.getSelection && String(window.getSelection())) return;   // selecting code
  flip();
});

  if(sheet.classList.contains('on') && e.key!=='Escape') return;

  if(e.key==='ArrowRight'){go(1);return;}

/* Expanded state lives in memory only, never in prefs — it's "which topic am I browsing right now",
   not a setting. Syncing it across devices would only make them fight each other. */
let sOpen = new Set();

function renderSecs(){
  const host=el('#secs'); host.innerHTML='';
  const names = Object.keys(SECTIONS).filter(name=>CARDS.some(c=>c.s===name));
  el('#secN').textContent = T('menu.topic_count', {n: names.length});

  names.forEach(name=>{
    const idxs = CARDS.map((c,i)=>i).filter(i=>CARDS[i].s===name);
    const n = idxs.length;
    const k = idxs.filter(i=>known.has(i)).length;
    const t = idxs.filter(i=>todo.has(CARDS[i].lc)).length;
    const on = !S.secs.length || S.secs.includes(name);

    const g=document.createElement('div');
    g.className='sgrp'+(sOpen.has(name)?' open':'');

    const head=document.createElement('div'); head.className='sgh';
    head.innerHTML=`<div class="nm"><span class="car">›</span>

      <span class="chk ${on?'on':''}">✓</span>`;

    head.querySelector('.nm').onclick=()=>{

    };
    head.querySelector('.chk').onclick=()=>{
      const all=Object.keys(SECTIONS);
      let cur = S.secs.length?[...S.secs]:[...all];
      cur = cur.includes(name)?cur.filter(x=>x!==name):[...cur,name];
      if(!cur.length) cur=[...all];

    const btn=document.createElement('button'); btn.className='only';

    btn.onclick=()=>{

      // "only unknown" would hide the ones already learned, the exact opposite of the intent.
      S.secs=[name]; S.onlyTodo=false; S.onlyUnknown=false;

    idxs.sort((a,b)=>(CARDS[a].k==='C'?0:1)-(CARDS[b].k==='C'?0:1));

      row.innerHTML=`<span class="st ${isK?'k':''}">${isK?'✓':'○'}</span>
        <span class="tx">${c.t}</span>

        <span class="tag">${T(c.k==='C' ? 'tag.concept' : 'tag.problem')}</span>`;
      row.onclick=()=>{ goToCard(i); closeSheet(); };

    g.appendChild(body);

  // Only appears once a filter is applied — takes no room normally, and once narrowed gets you back to everything in one tap.
  if(S.secs.length){

    back.textContent=T('menu.restore_all', {k: S.secs.length, n: names.length});
    back.onclick=()=>{

  el('#kindP').querySelector('.chk').classList.toggle('on', !S.kinds.length || S.kinds.includes('P'));
  el('#kindC').querySelector('.chk').classList.toggle('on', !S.kinds.length || S.kinds.includes('C'));

  el('#syncTxt').textContent = syncMsg;
  el('#keyShow').textContent = SK ? SK.slice(0,6) + '…' + SK.slice(-4) : '';
  try{

  const tl = el('#todoList'); tl.innerHTML = '';
  CARDS.filter(c=>todo.has(c.lc)).forEach(c=>{
    const r=document.createElement('div'); r.className='row';

  // Variants can go on the to-do list too — they have no card, so tapping opens LeetCode directly
  VARIANTS.filter(v=>todo.has(v.lc)).forEach(v=>{
    const r=document.createElement('div'); r.className='row';
    r.innerHTML=`<span class="sw" style="background:${v.c};opacity:.45"></span>
      <span>${v.t}</span><span class="rc">${T('tag.variant')}</span>`;
    r.onclick=()=>window.open(`https://leetcode.com/problems/${v.g}/`,'_blank','noopener');
    tl.appendChild(r);

  renderVars();
  el('#onlyUnknown').querySelector('.chk').classList.toggle('on',S.onlyUnknown);
  el('#shuffleRow').querySelector('.chk').classList.toggle('on',S.shuffled);
  el('#wrapRow').querySelector('.chk').classList.toggle('on',S.wrap!==false);

/* ---------- cross-device sync ----------
   The key is read from the URL's #k=… and stored in localStorage and a cookie; it stays in the address bar (see pinKey).
   Each sync is one POST round trip: send this device's doc up, the server merges entry by entry on timestamps
   and sends the merged result back. There is no separate "pull" — the merge itself is the pull. */
const SKEY = 'gc_sync_key', SYNC_URL = '/api/state';

/* The key is DELIBERATELY left in the address bar; don't replaceState it away again.
   An iOS home-screen app has a storage jar completely isolated from Safari's — localStorage, cookies and
   Service Workers are all unshared. Wipe the hash and "Add to Home Screen" captures a URL without the key;
   that home-screen app boots up empty, which looks exactly like "my progress got wiped".
   Leave k in the URL and the icon itself carries the key, so it can recover on its own even after Safari
   clears localStorage at 7 days (ITP). The cost is a key visible in the address bar — it only guards study progress. Worth it. */
/* localStorage gets swept away by iOS storage eviction. Cookies go through a different eviction path,
   so store a second copy: as long as either one survives, the key is still there. */
function keyCookie(v){
  try{
    if(v === undefined){
      const m = /(?:^|;\s*)gc_k=([a-f0-9]{32})/.exec(document.cookie || '');
      return m ? m[1] : '';
    }
    document.cookie = 'gc_k=' + v + ';path=/;max-age=63072000;samesite=lax';
  }catch(e){}
  return '';
}

function readKey(){
  // Accept both cases. The key is hex, so upper and lower case are the same key, but with only [a-f0-9]
  // a single capital letter in the address bar fails the whole match and the UI shows "off" —
  // while the input box in the menu (setKey) lowercases before validating, so the very same key
  // "works when pasted into the box, fails when put in the link", which is extremely hard to guess.
  const m = /[#&]k=([a-fA-F0-9]{32})\b/.exec(location.hash || '');
  if(m){
    const k = m[1].toLowerCase();
    try{ localStorage.setItem(SKEY, k); }catch(e){}
    keyCookie(k);
    return k;
  }
  let k = '';
  try{ k = localStorage.getItem(SKEY) || localStorage.getItem('cf_sync_key') || ''; }catch(e){}
  if(!k) k = keyCookie();                       // localStorage was cleared, the cookie survived
  if(k){ try{ localStorage.setItem(SKEY, k); }catch(e){} keyCookie(k); }
  return k;
}
let SK = readKey();

/* [The key MUST stay in the address bar at all times] This is the real cause of "my progress is gone again":
   when the key comes out of localStorage, the address bar is clean; "Add to Home Screen" at that moment
   hands iOS a URL without the key. The home-screen app's storage is fully isolated from Safari's, so
   new icon launch = empty jar + no key = a blank slate, with no visible reason why.
   Whenever there is a key, write it back into the hash, no matter where it came from. */
function pinKey(){
  if(SK && location.hash.indexOf('k=') < 0){
    try{ history.replaceState(null, '', location.pathname + location.search + '#k=' + SK); }
    catch(e){ location.hash = 'k=' + SK; }
  }
}
pinKey();

const canSync = ()=> !!SK && /^https?:$/.test(location.protocol);

/* Manual reconnect: the fallback for a new device, a cleared cache, or a home-screen app that is a fresh jar.
   No need to dig up the original link; just paste the key in. */
function setKey(k){
  k = String(k||'').trim().toLowerCase().replace(/^.*[#&]k=/, '').slice(0, 32);
  if(!/^[a-f0-9]{32}$/.test(k)) return false;
  SK = k;
  try{ localStorage.setItem(SKEY, k); }catch(e){}
  keyCookie(k);
  if(location.hash.indexOf('k=') < 0) location.hash = 'k=' + k;
  sync();
  return true;
}

let syncMsg = T(SK ? 'sync.pending' : 'sync.off');
function setSync(m){ syncMsg = m; const n = document.getElementById('syncTxt'); if(n) n.textContent = m; }

function snapshot(){ return {v:1, cards:S.cards||{}, todoM:S.todoM||{}, prefs:prefsOut(), view:viewOut()}; }

/* Take the newer entry by timestamp, one by one. Must match the rule in sync/netlify/functions/state.mjs;
   with both sides using the same merge, sync has no such thing as "who overwrites whom". */
function mergeMap(a, b){
  const out = Object.assign({}, a || {});
  for(const [k, v] of Object.entries(b || {})){
    if(!v || typeof v !== 'object') continue;
    const t = Number(v.t) || 0;
    if(!out[k] || t >= (Number(out[k].t) || 0)) out[k] = v;
  }
  return out;
}

/* Local fallback snapshot: only overwritten when the "cards known" count hasn't dropped below last time's, so it is always the all-time best.
   However badly sync misbehaves, one tap in the menu fishes it back. */
const BKEY = 'gc_v1_bak';
function backup(){
  try{
    const prev = JSON.parse(localStorage.getItem(BKEY) || 'null');
    const n = Object.values(S.cards || {}).filter(e => e && e.k).length;
    if(!prev || n >= (prev.n || 0))
      localStorage.setItem(BKEY, JSON.stringify({n, at: Date.now(), doc: snapshot()}));
  }catch(e){}
}
function restoreBackup(){
  try{
    const b = JSON.parse(localStorage.getItem(BKEY) || 'null');
    if(!b || !b.doc) return null;
    S.cards = mergeMap(S.cards, b.doc.cards);
    S.todoM = mergeMap(S.todoM, b.doc.todoM);
    applyPrefs(b.doc.prefs);
    store.set(S); hydrate(); buildDeck(true); paint(); renderSecs();
    schedulePush();
    return b;
  }catch(e){ return null; }
}
const fingerprint = ()=> [...known].sort((a,b)=>a-b).join(',') + '|' + [...todo].sort((a,b)=>a-b).join(',');

let pushT = null, syncing = false, firstSync = true;
function schedulePush(){
  if(!canSync()) return;
  clearTimeout(pushT); pushT = setTimeout(sync, 1500);
}

async function sync(){
  if(!canSync() || syncing) return;
  syncing = true; setSync(T('sync.busy'));
  const before = fingerprint();
  try{
    const r = await fetch(SYNC_URL, {method:'POST', cache:'no-store',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({k: SK, doc: snapshot()})});
    if(!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0,80));
    const m = await r.json();
    // [NEVER replace local with the remote result] — this was the direct cause of the previous version losing data.
    // If the server returns empty for any reason whatsoever (function not deployed, request body never arrived,
    // a redeploy that starts with a fresh blob store), replacing wipes progress on the spot, and the next line writes it straight into localStorage.
    // Use the same per-entry timestamp merge as the server instead: local only ever moves forward, never gets truncated.
    S.cards = mergeMap(S.cards, m.cards);
    S.todoM = mergeMap(S.todoM, m.todoM);
    const prefsChanged = applyPrefs(m.prefs);
    store.set(S); hydrate(); dirty = false;
    backup();
    // only rebuild the deck if the remote actually brought a change, otherwise it flickers while you're mid-flip
    const dataChanged = fingerprint() !== before;
    if(dataChanged || prefsChanged) buildDeck(true);
    // [Remote position applies only on the first sync after opening] otherwise the moment another device moves,
    // the card in your hand is yanked away mid-read — sync should be "pick up where I left off, on open",
    // not "two screens tugging at each other". Must come after buildDeck: the deck is fixed first, only then does a position mean anything.
    const jumped = firstSync && applyView(m.view);
    firstSync = false;
    if(dataChanged || prefsChanged || jumped) paint();
    renderSecs();
    setSync(T('sync.ok', {k: known.size, n: CARDS.length}));
  }catch(e){
    // The concrete error must be surfaced. The previous version just said "sync failed", so nobody could tell
    // function-not-deployed from wrong-key from network-down — three faults that look exactly alike.
    setSync(T('sync.fail', {err: (e && e.message ? e.message : e)}));
  }finally{ syncing = false; }
}

/* When iOS kills a page, beforeunload/unload often never fire; visibilitychange→hidden is the only reliable one.
   sendBeacon is unaffected by the page being reclaimed; the key goes in the body rather than the query so it stays out of access logs. */
function flush(){
  if(!canSync() || !dirty) return;
  clearTimeout(pushT);
  try{
    const blob = new Blob([JSON.stringify({k: SK, doc: snapshot()})], {type:'application/json'});
    if(navigator.sendBeacon(SYNC_URL, blob)) dirty = false;
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden') flush();
  else if(canSync()) sync();                 // on coming back, first check what the other devices drilled
});
addEventListener('pagehide', flush);

el('#copyKey').onclick = ()=>{
  if(!SK){ setSync(T('sync.nokey')); return; }
  const done = ()=> setSync(T('sync.key_copied'));
  if(navigator.clipboard) navigator.clipboard.writeText(SK).then(done, ()=>prompt(T('sync.key_prompt'), SK));
  else prompt(T('sync.key_prompt'), SK);
};

el('#restore').onclick = ()=>{
  const b = restoreBackup();
  const btn = el('#restore');
  btn.textContent = b ? T('menu.restore_ok', {n: b.n}) : T('menu.restore_none');
  setTimeout(()=>btn.textContent = T('menu.restore_local'), 2200);
};

/* Progress code: snapshot() squeezed into one line of base64.
   Import goes through exactly the same mergeMap as sync — newer entry by timestamp, one by one —
   so importing only ever moves progress forward and never erases what's already been learned. */
function encProg(){
  const raw = JSON.stringify({v:1, doc:snapshot()});
  return btoa(unescape(encodeURIComponent(raw)));
}
function decProg(code){
  const o = JSON.parse(decodeURIComponent(escape(atob(String(code||'').trim()))));
  if(!o || !o.doc) throw new Error('not a progress code');
  return o.doc;
}

el('#expProg').onclick = ()=>{
  const code = encProg();
  const n = Object.values(S.cards||{}).filter(e=>e&&e.k).length;
  const done = ()=> setSync(T('menu.export_ok', {n}));
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(done, ()=>prompt(T('menu.export_prompt'), code));
  } else prompt(T('menu.export_prompt'), code);
};

el('#impSet').onclick = ()=>{
