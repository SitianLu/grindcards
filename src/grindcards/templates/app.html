    S.todoM = mergeMap(S.todoM, doc.todoM);
    applyPrefs(doc.prefs);
    store.set(S); backup(); hydrate(); buildDeck(true);
    applyView(doc.view);
    paint(); renderSecs();
    schedulePush();
    inp.value = '';
    setSync(T('menu.import_ok', {k: known.size, n: CARDS.length, d: known.size-before}));
  }catch(e){ setSync(T('menu.import_fail')); }
};

el('#syncLink').onclick = ()=>{
  if(!SK){ setSync(T('sync.link_nokey')); return; }
  const url = location.origin + location.pathname + '#k=' + SK;
  const done = ()=> setSync(T('sync.link_copied'));
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done, ()=>prompt(T('sync.link_prompt'), url));
  } else prompt(T('sync.link_prompt'), url);
};

/* Real viewport / safe-area numbers. env() is only readable from CSS, so borrow a probe element to measure it. */
(function(){
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;'
    + 'padding:env(safe-area-inset-top) env(safe-area-inset-right)'
    + ' env(safe-area-inset-bottom) env(safe-area-inset-left)';
  document.body.appendChild(probe);
  const c = getComputedStyle(probe);
  const n = v => Math.round(parseFloat(v) || 0);
  const st = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  // screen height > viewport height = iOS boxed the page into a frame shorter than the screen (viewport-fit=cover didn't take).
  // That bottom strip is then outside the page and no CSS can fill it — you have to "Add to Home Screen" again
  // to make iOS re-read the cover setting. Print the difference outright so it can be judged at a glance.
  const lost = Math.max(0, Math.round((screen.height || 0) - innerHeight));
  el('#vp').textContent = T('vp', {vw: innerWidth, vh: innerHeight, sw: screen.width, sh: screen.height,
                                   top: n(c.paddingTop), bottom: n(c.paddingBottom)})
    + T(st ? 'vp.home' : 'vp.browser')
    + (st && lost > 8 ? T('vp.short', {px: lost}) : '');
  probe.remove();
})();

/* [Restore position locally too] Position used to be applied only when sync came back, so when offline, before
   sync finished, or with sync never connected at all, reopening always landed on card 1 — even though the last card seen was stored locally.
   Same for order: the seed is stored locally, so buildDeck can shuffle out the identical deck order directly. */
function restoreLocalView(){
  const idx = IDX.get(S.viewCard || '');
  if(idx === undefined) return;
  const i = deck.indexOf(idx);
  if(i >= 0){ pos = i; flipped = false; shown = 0; }
}

applyI18n();
buildDeck(false); restoreLocalView(); paint();
if(canSync()) sync();

/* Once installed on the home screen without a key, nothing anywhere in the UI shows it — progress quietly stays on this device only.
   That kind of silent degradation is exactly the hardest class of problem to notice, so say it explicitly. */
const STANDALONE = navigator.standalone === true ||
                   matchMedia('(display-mode: standalone)').matches;
if(STANDALONE && !SK && /^https?:$/.test(location.protocol)){
  el('#nokey').classList.add('on');
  // [Do NOT auto-dismiss] This banner is the only thing that explains "why is everything blank".
  // Hiding itself after 12 seconds amounts to leaving the user guessing at an empty app. Keep it until they act on it.
  el('#nokeyGo').onclick = ()=>{ el('#nokey').classList.remove('on'); openSheet(); };
}

/* ---------- Chrome / Edge "Install app" ----------
   sw.js is network-first: a new deploy takes effect on the next refresh; it only falls back to the cache when offline.
   Skipped outright when opened from file://, so the single-file version still works. */
const SW_OK = location.protocol==='https:' ||
              ['localhost','127.0.0.1'].includes(location.hostname);
if('serviceWorker' in navigator && SW_OK){
  addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
